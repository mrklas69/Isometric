<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Isometric — MVP</title>
  <style>
    /* Reset + plnoplošný canvas. PixiJS canvas mountuje do #app. */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #181425; }
    body { font-family: -apple-system, system-ui, "Segoe UI", sans-serif; color: #c0cbdc; }
    #app { position: absolute; inset: 0; }
    #app canvas { display: block; }

    /* HUD overlay — časomíra v levém horním rohu. */
    #hud {
      position: absolute; top: 12px; left: 12px;
      padding: 6px 12px;
      background: rgba(24, 20, 37, 0.7);
      border: 1px solid #3a4466;
      border-radius: 6px;
      font-variant-numeric: tabular-nums;
      font-size: 14px;
      letter-spacing: 0.5px;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud">00:00</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
